name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: pnpm
      - run: pnpm install
      - run: cp apps/api/.env.example apps/api/.env && cp apps/web/.env.example apps/web/.env
      - run: pnpm --filter @racing/shared build
      - run: pnpm --filter @racing/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @racing/api exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm build
