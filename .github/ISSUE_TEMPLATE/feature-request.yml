name: Feature request
description: Propose an improvement or new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem or idea?
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
      description: How would you implement or use it?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web (game / UI)
        - api
        - tests / CI
        - docs
        - other
