  - "@nestjs/core"
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - bcrypt
  - better-sqlite3

allowBuilds:
  esbuild: true
  "@nestjs/core": true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  bcrypt: true
  better-sqlite3: true
